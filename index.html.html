<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>తెలుగు హ్యాండ్‌బుక్ (లెవెల్–1) – అక్షరాలు, పదాలు, ఆటో ప్లే, క్విజ్</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@500;700;800&family=Noto+Sans+Telugu:wght@400;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --board:#1E4D3A; --board2:#163B2C; --chalk:#F6F7F2; --page:#E9EFEB; --ink:#1A2620;
  --muted:#5C6E64; --gold:#F4B400; --ok:#2E9E5B; --bad:#D9483B; --line:#C9D6CE; --card:#FFFFFF;
  --fe:'Baloo Tamma 2','Noto Sans Telugu',system-ui,sans-serif;
  --ft:'Noto Sans Telugu','Baloo Tamma 2',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--ft);background:var(--page);color:var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

header{position:sticky;top:0;z-index:30;background:var(--board);color:var(--chalk);display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
header h1{font-family:var(--fe);font-size:1.15rem;font-weight:700;flex:1;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 small{display:block;font-size:.72rem;font-weight:500;opacity:.75}
.hbtn{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.1);font-size:1.3rem;display:grid;place-items:center;flex:none}
.hbtn.off{opacity:.45}

/* drawer */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
#drawer{position:fixed;top:0;left:0;bottom:0;width:min(300px,86vw);background:var(--card);z-index:50;transform:translateX(-102%);transition:transform .25s ease;overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
body.menu #drawer{transform:none} body.menu #scrim{display:block}
#drawer h3{font-size:.85rem;color:var(--muted);padding:14px 16px 6px;font-weight:600}
.mi{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:10px 16px;font-size:1rem;border-left:4px solid transparent}
.mi span{font-size:.78rem;color:var(--muted);background:var(--page);border-radius:10px;padding:1px 8px}
.mi.on{background:#E3F1E8;border-left-color:var(--board);font-weight:700}
.mi.kf{background:#FFF4D1}

/* tabs */
.tabs{display:flex;gap:6px;padding:10px 12px 0;max-width:760px;margin:0 auto}
.tab{flex:1;padding:10px;border-radius:12px 12px 0 0;background:#D6E2DA;font-weight:700;color:var(--muted)}
.tab.on{background:var(--card);color:var(--board)}
main{max-width:760px;margin:0 auto;background:var(--card);min-height:60vh;padding:14px 12px 20px;border-radius:0 0 16px 16px}

/* board card */
.stick{position:sticky;top:var(--hh,62px);z-index:20;background:var(--card);margin:-14px -12px 0;padding:10px 12px 2px;border-bottom:2px solid var(--line)}
.board{background:var(--board);background-image:radial-gradient(circle at 20% 10%,rgba(255,255,255,.06),transparent 60%);border:8px solid #8A5A2B;border-radius:14px;color:var(--chalk);padding:16px 14px 18px;text-align:center;position:relative;min-height:200px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.board .meta{position:absolute;top:8px;left:12px;right:12px;display:flex;justify-content:space-between;font-size:.85rem;opacity:.8}
.board .fam{color:var(--gold);font-family:var(--fe);font-weight:700}
.word{font-family:var(--fe);font-weight:800;font-size:clamp(2.6rem,11vw,5rem);line-height:1.05;letter-spacing:.01em;word-break:break-word;margin-top:14px}
.spellrow{font-family:var(--fe);font-size:1.3rem;letter-spacing:.35em;color:#BFD8C9;min-height:1.6rem}
.mean{font-size:clamp(1.3rem,5.5vw,2rem);color:var(--gold);font-weight:700;min-height:2.4rem}
.mean.hid{filter:blur(9px);cursor:pointer}
.say{position:absolute;right:10px;bottom:10px;width:48px;height:48px;border-radius:50%;background:var(--gold);color:var(--board2);font-size:1.4rem}

.ctrls{display:flex;gap:8px;justify-content:center;margin:10px 0 8px}
.cb{min-width:56px;height:52px;border-radius:14px;background:var(--page);font-size:1.3rem;font-weight:700;padding:0 14px}
.cb.play{background:var(--board);color:var(--chalk);flex:1;max-width:220px;font-size:1.05rem}
.cb.play.on{background:var(--bad)}
.opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font-size:.9rem;margin-bottom:10px}
.chip{border:1.5px solid var(--line);border-radius:20px;padding:6px 12px;background:var(--card)}
.chip.on{background:#E3F1E8;border-color:var(--board);color:var(--board);font-weight:700}
select{font:inherit;border:1.5px solid var(--line);border-radius:20px;padding:5px 10px;background:var(--card)}

.grid{padding-top:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:6px}
.gi{scroll-margin-top:calc(var(--hh,62px) + var(--sh,330px) + 8px);scroll-margin-bottom:12px;text-align:left;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--card)}
.gi b{display:block;font-family:var(--fe);font-size:1.1rem}
.gi i{font-style:normal;font-size:.85rem;color:var(--muted)}
.gi.on{border-color:var(--gold);background:#FFF7DD}
.gh{grid-column:1/-1;font-family:var(--fe);font-weight:700;color:var(--board);padding-top:6px;border-bottom:2px dashed var(--line)}

/* quiz */
.qsetup h2{font-size:1.2rem;margin-bottom:10px;color:var(--board)}
.row{margin:12px 0}
.row label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:6px}
.big{width:100%;padding:14px;border-radius:14px;background:var(--board);color:var(--chalk);font-size:1.15rem;font-weight:700;margin-top:10px}
.best{font-size:.9rem;color:var(--muted);margin-top:10px;text-align:center}
.qtop{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted);margin-bottom:8px}
.bar{height:8px;background:var(--page);border-radius:4px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.qboard{min-height:180px}
.qask{font-size:1rem;opacity:.85}
.qword{font-family:var(--fe);font-weight:800;font-size:clamp(2rem,9vw,3.6rem);line-height:1.1}
.qword.te{font-family:var(--ft);font-size:clamp(1.6rem,7vw,2.6rem);color:var(--gold)}
.listen{width:92px;height:92px;border-radius:50%;background:var(--gold);color:var(--board2);font-size:2.6rem;margin:6px auto}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ab{border:2px solid var(--line);border-radius:14px;padding:14px 10px;font-size:1.1rem;font-weight:600;background:var(--card);text-align:left;display:flex;gap:8px;align-items:center;min-height:62px}
.ab em{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--page);display:grid;place-items:center;font-size:.8rem;flex:none}
.ab.en{font-family:var(--fe);font-size:1.3rem}
.ab.ok{background:#DFF3E6;border-color:var(--ok)} .ab.ok em{background:var(--ok);color:#fff}
.ab.no{background:#FBE3E0;border-color:var(--bad)} .ab.no em{background:var(--bad);color:#fff}
.fb{text-align:center;font-weight:700;min-height:1.6rem;margin-top:10px}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}
.res{text-align:center}
.res .sc{font-family:var(--fe);font-size:4rem;font-weight:800;color:var(--board);line-height:1}
.stars{font-size:2rem;margin:6px 0}
.wl{text-align:left;margin-top:14px;border-top:2px dashed var(--line);padding-top:10px}
.wl div{padding:6px 0;border-bottom:1px solid var(--page)}
.two{display:flex;gap:8px}.two .big{flex:1}
.big.alt{background:var(--page);color:var(--board)}

footer{text-align:center;padding:18px 12px 24px;color:var(--muted);font-size:.85rem}
footer b{display:block;font-family:var(--fe);font-size:1.3rem;color:var(--board)}
.keys{font-size:.78rem;margin-top:6px}
/* colourful letters + falling rain */
.board{overflow:hidden}
.board>*:not(.rain){position:relative;z-index:2}
.board>.meta{position:absolute}.board>.say{position:absolute;z-index:3}
.word .L{display:inline-block;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both;text-shadow:0 3px 0 rgba(0,0,0,.25);transition:transform .15s}
.word .U{display:inline-block;margin:0 .03em}
.word .U.multi{border-bottom:5px solid currentColor;border-radius:3px;padding:0 .02em}
.word .U.me{border-bottom:5px dotted currentColor}
.word .L.hi{transform:translateY(-10px) scale(1.25);text-decoration:underline 4px}
@keyframes pop{from{opacity:0;transform:translateY(-40px) scale(.4)}to{opacity:1;transform:none}}
.rain{position:absolute;inset:0;pointer-events:none;z-index:1}
.drop{position:absolute;top:-60px;animation:fall linear forwards;opacity:.9}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(var(--sw),160px) rotate(calc(var(--rt)/2))}100%{transform:translate(calc(var(--sw)*-1),var(--fh,420px)) rotate(var(--rt));opacity:.5}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-height:760px){.board{min-height:160px;padding:12px 12px 14px}.word{font-size:clamp(2.2rem,10vw,4rem);margin-top:10px}.board .say{width:42px;height:42px;font-size:1.2rem}}
@media (min-width:700px){.ans{grid-template-columns:1fr 1fr}}

/* Telugu additions */
.word{font-family:var(--fe);line-height:1.25}
.word .U{margin:0 .02em}
.pic{display:block;margin:12px auto 0;max-height:120px;max-width:70%;border-radius:12px;background:#fff;padding:6px;position:relative;z-index:2}
.gi .th{width:100%;height:56px;object-fit:contain;display:block;margin-bottom:4px}
.gi b{font-family:var(--fe)}
.gi small{float:right;font-size:.7rem;color:var(--muted)}
.qpic{max-height:140px;max-width:70%;background:#fff;border-radius:12px;padding:6px;margin:6px auto;display:block;position:relative;z-index:2}
.ab.img{justify-content:center;padding:6px}.ab.img img{max-height:90px;max-width:100%}
.ab.big2{font-family:var(--fe);font-size:1.8rem;justify-content:center}
.eq{font-family:var(--fe);font-size:clamp(1.6rem,7vw,2.6rem);font-weight:800}
.eq i{font-style:normal;color:var(--gold)}
.src{font-size:.75rem;margin-top:4px}
</style>
</head>
<body>
<div id="scrim" onclick="menu(false)"></div>
<nav id="drawer" aria-label="విభాగాలు"></nav>
<header>
  <button class="hbtn" onclick="menu()" aria-label="మెనూ">☰</button>
  <h1 id="ttl">తెలుగు హ్యాండ్‌బుక్<small>ఒకటవ తరగతి</small></h1>
  <button class="hbtn" id="vbtn" onclick="toggleVoice()" aria-label="వాయిస్">🔊</button>
</header>
<div class="tabs">
  <button class="tab on" id="t1" onclick="view('learn')">📖 నేర్చుకోండి / ఆటో ప్లే</button>
  <button class="tab" id="t2" onclick="view('quiz')">📝 క్విజ్</button>
</div>
<main id="main"></main>
<footer>
  <b>రాయ్ ఎడ్యుకేషన్</b>Raay Education
  <div class="src">ఆధారం: Telugu Handbook (Level-1), P. రామాంజనేయులు సార్</div>

</footer>

function rain(el,n){if(!S.rain||!el)return;
  let src;if(S.rtheme==="cat"&&EMO[cat.id])src=EMO[cat.id];else{const t=THEMES.find(t=>t[0]===S.rtheme)||THEMES[rot++%THEMES.length];src=t[2]}
  const pool=[];for(const c of src.match(/\p{Extended_Pictographic}\ufe0f?/gu)||[])pool.push(c);
  const W=el.clientWidth,H=el.clientHeight+80;
  for(let i=0;i<(n||14);i++){const d=document.createElement("span");d.className="drop";
    d.textContent=pool[Math.random()*pool.length|0];
    d.style.left=(Math.random()*(W-30))+"px";d.style.fontSize=(22+Math.random()*22)+"px";
    d.style.setProperty("--sw",(Math.random()*60-30)+"px");d.style.setProperty("--rt",(Math.random()*540-270)+"deg");d.style.setProperty("--fh",H+"px");
    d.style.animationDuration=(2.4+Math.random()*2.2)+"s";d.style.animationDelay=(Math.random()*1.2)+"s";
    d.addEventListener("animationend",()=>d.remove());el.appendChild(d)}}

let VOICES=[];function loadV(){try{VOICES=speechSynthesis.getVoices()}catch(e){}}
if("speechSynthesis" in window){loadV();speechSynthesis.onvoiceschanged=loadV}
function pickV(lang){const l=lang.toLowerCase(),b=l.slice(0,2);return VOICES.find(v=>v.lang.replace("_","-").toLowerCase()===l)||VOICES.find(v=>v.lang.toLowerCase().startsWith(b))}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function say(text,lang,rate){return new Promise(res=>{
  if(!S.voice||!("speechSynthesis" in window)||!text){setTimeout(res,250);return}
  const u=new SpeechSynthesisUtterance(text);u.lang=lang||"te-IN";const v=pickV(u.lang);if(v)u.voice=v;u.rate=rate||.8;
  let d=false;const f=()=>{if(!d){d=true;res()}};u.onend=f;u.onerror=f;setTimeout(f,2500+text.length*260);speechSynthesis.speak(u)})}
function stopSpeech(){seq++;try{speechSynthesis.cancel()}catch(e){}}
async function speakItem(it){stopSpeech();const my=seq;
  for(let k=0;k<it.say.length;k++){const[t,l]=it.say[k];
    const isWord=it.word&&t===it.w;
    if(isWord&&S.spell){const A=aks(it.w).filter(a=>a.trim());
      if(A.length>1){for(let i=0;i<A.length;i++){if(my!==seq)return false;
        document.querySelectorAll(".word .L").forEach(x=>x.classList.toggle("hi",+x.dataset.li===i));await say(A[i],"te-IN",.7);await wait(120)}
        document.querySelectorAll(".word .L").forEach(x=>x.classList.remove("hi"))}}
    if(my!==seq)return false;await say(t,l);if(my!==seq)return false;await wait(250)}
  return my===seq}

const MODES={letter:[["listen","విని అక్షరం ఎంచుకోండి"]],
  pic:[["listenpic","విని బొమ్మ ఎంచుకోండి"],["picword","బొమ్మ చూసి పదం"],["picletter","బొమ్మ – అక్షరం"]],
  sign:[["signname","గుర్తు పేరు చెప్పండి"],["listen","విని గుర్తు ఎంచుకోండి"]],
  guni:[["join","హల్లు + గుర్తు = ?"],["listen","విని ఎంచుకోండి"]],

function modes(){return MODES[cat.type]}

function qSetup(){const M=modes();if(!M.find(m=>m[0]===S.qmode))S.qmode=M[0][0];const best=LS("best_"+cat.id);
  $("#main").innerHTML=`<div class="qsetup"><h2>📝 ${esc(cat.te)} – క్విజ్</h2>
  <div class="row"><label>ప్రశ్న రకం</label><div class="opts" style="justify-content:flex-start">${M.map(m=>`<button class="chip${S.qmode===m[0]?" on":""}" onclick="S.qmode='${m[0]}';save();render()">${m[1]}</button>`).join("")}</div></div>
  <div class="row"><label>ప్రశ్నల సంఖ్య (మొత్తం ${cat.items.length})</label><div class="opts" style="justify-content:flex-start">${[10,20,30,0].map(n=>`<button class="chip${S.qn===n?" on":""}" onclick="S.qn=${n};save();render()">${n||"అన్నీ"}</button>`).join("")}</div></div>
  <button class="big" onclick="qStart()">▶ క్విజ్ ప్రారంభించండి</button>
  ${best?`<div class="best">🏆 ఉత్తమ స్కోరు: ${best.s}/${best.t}</div>`:""}
  <div class="best">కీబోర్డ్/రిమోట్: 1–4 జవాబు · Enter తర్వాతి ప్రశ్న</div></div>`}
function distract(pool,key,ans,n=3){return shuf(pool.map(key).filter((v,i,a)=>v!==ans&&v!==undefined&&v!==""&&a.indexOf(v)===i)).slice(0,n)}
function makeQ(it){const P=cat.items,m=S.qmode;const q={it,opts:[],optType:"text"};
  const first=x=>aks(x.w).filter(a=>a.trim())[0];
  switch(m){
  case"listen":{q.ask=cat.type==="num"?"విన్న సంఖ్యను ఎంచుకోండి":"విన్నదాన్ని ఎంచుకోండి";q.listen=true;
    let pool=P;if(cat.type==="guni")pool=P.filter(x=>x.c===it.c);
    q.ans=it.w;q.opts=[q.ans,...distract(pool,x=>x.w,q.ans)];q.qsay=cat.type==="sign"?[T(it.name)]:[it.say[0]];q.big=true;break}
  case"listenpic":q.ask="విన్న పదానికి బొమ్మ ఏది?";q.listen=true;q.ans=it.pic;q.opts=[it.pic,...shuf(P.filter(x=>x.w!==it.w)).slice(0,3).map(x=>x.pic)];q.optType="img";q.qsay=[T(it.w)];break;
  case"picword":q.ask="ఈ బొమ్మ పేరు ఏమిటి?";q.show=`<img class="qpic" src="${img(it.pic)}" alt="">`;q.ans=it.w;q.opts=[it.w,...distract(P,x=>x.w,it.w)];q.qsay=[T("ఈ బొమ్మ పేరు ఏమిటి?")];break;
  case"picletter":q.ask="ఈ బొమ్మ ఏ అక్షరం గదిలో ఉంది?";q.show=`<img class="qpic" src="${img(it.pic)}" alt=""><div class="qword">${colorWord(it.w)}</div>`;q.ans=it.ch;q.opts=[it.ch,...distract(P,x=>x.ch,it.ch)];q.qsay=[T(it.w)];q.big=true;break;
  case"signname":q.ask="ఈ గుర్తు పేరు ఏమిటి?";q.show=`<div class="qword" style="color:var(--gold)">${esc(it.w)}</div><div class="eq">${colorWord(it.ex)}</div>`;q.ans=it.name;q.opts=[it.name,...distract(P,x=>x.name,it.name)];q.qsay=[T(it.ex)];break;
  case"join":q.ask="హల్లుకు గుర్తు చేరిస్తే ఏమవుతుంది?";q.show=`<div class="eq">${esc(it.c)} + <i>${it.si?"◌"+SIGNS[it.si]:"✓"}</i> (${esc(SNAME[it.si])}) = ?</div>`;
    q.ans=it.w;q.opts=[it.w,...distract(P.filter(x=>x.c===it.c),x=>x.w,it.w)];q.qsay=[T(it.c+" "+SNAME[it.si])];q.big=true;break;
  case"first":q.ask="ఈ పదంలో మొదటి అక్షరం ఏది?";q.show=`<div class="qword">${esc(it.w)}</div>`;q.ans=first(it);q.opts=[q.ans,...distract(P,first,q.ans)];q.qsay=[T(it.w)];q.big=true;break;
  case"pre":q.ask="ఏ అక్షరం చేర్చితే కొత్త పదం వచ్చింది?";q.show=`<div class="eq"><i>?</i> + ${esc(it.base)} = ${colorWord(it.w)}</div>`;q.ans=it.pre;q.opts=[it.pre,...distract(P,x=>x.pre,it.pre)];q.qsay=[T(it.base),T(it.w)];q.big=true;break;
  case"d2name":q.ask="ఈ సంఖ్య పేరు ఏమిటి?";q.show=`<div class="qword">${esc(it.w)}</div>`;q.ans=it.m;q.opts=[it.m,...distract(P.filter(x=>Math.abs(x.n-it.n)<15),x=>x.m,it.m)];q.qsay=[];break;
  }
  if(q.opts.length<2)return null;q.opts=shuf(q.opts);return q}

function optHTML(q,o,i){if(q.optType==="img")return `<button class="ab img" data-i="${i}" onclick="qAns(${i})"><em>${i+1}</em><img src="${img(o)}" alt=""></button>`;
  return `<button class="ab${q.big?" big2":""}" data-i="${i}" onclick="qAns(${i})"><em>${i+1}</em>${esc(o)}</button>`}
function qShow(){const q=Q.qs[Q.i];Q.answered=false;
  $("#main").innerHTML=`<div class="qtop"><span>ప్రశ్న ${Q.i+1} / ${Q.qs.length}</span><span>✅ ${Q.score}</span></div>

   ${q.listen?`<button class="listen" onclick="qSay()" aria-label="మళ్ళీ వినండి">🔊</button>`:q.show}

async function qSay(){stopSpeech();const my=seq,q=Q.qs[Q.i];
  for(const[t,l]of q.qsay){if(my!==seq)return;await say(t,l);await wait(300)}
  if(q.listen&&my===seq&&q.qsay[0]){await wait(300);if(my===seq)await say(q.qsay[0][0],q.qsay[0][1],.65)}}
async function qAns(i){if(Q.answered)return;Q.answered=true;const q=Q.qs[Q.i],ok=q.opts[i]===q.ans;
  document.querySelectorAll(".ab").forEach(b=>{const t=q.opts[+b.dataset.i];if(t===q.ans)b.classList.add("ok");else if(+b.dataset.i===i)b.classList.add("no")});
  const fb=$("#fb"),ansTxt=q.optType==="img"?q.it.w:q.ans;
  if(ok){rain($("#qrain"),22);Q.score++;fb.className="fb ok";fb.textContent="🎉 సరైన జవాబు!"}
  else{Q.wrong.push(q);fb.className="fb no";fb.textContent="❌ సరైన జవాబు: "+ansTxt}
  $("#nx").innerHTML=`<button class="big" id="nb" onclick="qNext()">${Q.i<Q.qs.length-1?"తర్వాతి ప్రశ్న ⏭":"ఫలితం చూడండి 🏁"}</button>`;$("#nb").focus();
  stopSpeech();const my=seq;await say(ok?"సరైన జవాబు":"తప్పు. సరైన జవాబు","te-IN");if(my!==seq)return;
  await say(cat.type==="sign"&&q.optType!=="img"&&S.qmode==="listen"?q.it.name:ansTxt,"te-IN");
  if(my===seq&&cat.type!=="sign"&&S.qmode!=="listen"&&q.it.say){await wait(200);if(my===seq)await say(q.it.say[q.it.say.length-1][0],q.it.say[q.it.say.length-1][1])}}
function qNext(){stopSpeech();if(Q.i<Q.qs.length-1){Q.i++;qShow()}else{Q.done=true;const b=LS("best_"+cat.id);if(!b||Q.score/Q.qs.length>b.s/b.t)SS("best_"+cat.id,{s:Q.score,t:Q.qs.length});qResult()}}
function qResult(){const t=Q.qs.length,p=Math.round(Q.score/t*100);const st=p>=90?"⭐⭐⭐":p>=60?"⭐⭐":p>=30?"⭐":"💪";
  const msg=p>=90?"అద్భుతం!":p>=60?"చాలా బాగుంది!":"మళ్ళీ ప్రయత్నించండి!";
  $("#main").innerHTML=`<div class="res"><div class="stars">${st}</div><div class="sc">${Q.score}/${t}</div>
  <p style="margin:6px 0 14px;font-weight:700">${p}% · ${msg}</p>
  <div class="two">${Q.wrong.length?`<button class="big" onclick="qStart(Q.wrong.map(q=>q.it))">❌ తప్పులు మళ్ళీ (${Q.wrong.length})</button>`:""}
  <button class="big${Q.wrong.length?" alt":""}" onclick="qStart()">🔄 కొత్త క్విజ్</button></div>
  <button class="big alt" onclick="Q=null;render()">⚙ సెట్టింగ్స్</button>
  ${Q.wrong.length?`<div class="wl"><b>తప్పు జవాబులు:</b>${Q.wrong.map(q=>`<div><b style="font-family:var(--fe)">${esc(q.it.w)}</b> ${q.it.m?"– "+esc(q.it.m):""}</div>`).join("")}</div>`:""}</div>`;
  say(msg,"te-IN");if(p>=60){const r=document.createElement("div");r.className="rain";r.style.position="fixed";r.style.zIndex="60";document.body.appendChild(r);rain(r,40);setTimeout(()=>r.remove(),7000)}}

/* ============ VOICE / KEYS ============ */
function toggleVoice(){S.voice=!S.voice;save();if(!S.voice)stopSpeech();$("#vbtn").classList.toggle("off",!S.voice);$("#vbtn").textContent=S.voice?"🔊":"🔇"}
document.addEventListener("keydown",e=>{const k=e.key;
  if(document.body.classList.contains("menu")){const it=[...document.querySelectorAll("#drawer .mi")];let i=it.indexOf(document.activeElement);
    if(k==="ArrowDown"){e.preventDefault();it[Math.min(i+1,it.length-1)].focus()}
    else if(k==="ArrowUp"){e.preventDefault();it[Math.max(i-1,0)].focus()}
    else if(k==="Escape"||k==="Backspace"||k==="GoBack"){e.preventDefault();menu(false)}return}
  if(k==="Escape"||k==="GoBack"||k==="ContextMenu"){e.preventDefault();menu(true);return}
  if(e.target.tagName==="SELECT")return;
  if(tab==="learn"){
    if(k==="ArrowRight"||k==="PageDown"||k==="MediaTrackNext"){e.preventDefault();go(idx+1,1)}
    else if(k==="ArrowLeft"||k==="PageUp"||k==="MediaTrackPrevious"){e.preventDefault();go(idx-1,1)}
    else if(k===" "||k==="MediaPlayPause"){e.preventDefault();togglePlay()}
    else if(k==="Enter"&&!e.target.closest("button")){e.preventDefault();stopPlay();speakItem(list[idx])}
  }else if(Q&&!Q.done){if(/^[1-4]$/.test(k)&&!Q.answered)qAns(+k-1);else if(k==="Enter"&&Q.answered){e.preventDefault();qNext()}}});

build();$("#vbtn").classList.toggle("off",!S.voice);$("#vbtn").textContent=S.voice?"🔊":"🔇";render();
</script>
</body>
